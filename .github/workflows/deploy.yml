name: Build, Test & Deploy Company ERP

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: company-erp-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck, Build & Supabase Smoke Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript typecheck
        run: npm run lint

      - name: Build production bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || 'https://vqeptlsfqovfyjgjjaer.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxZXB0bHNmcW92ZnlqZ2pqYWVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5NzUyMTcsImV4cCI6MjExMDU1MTIxN30.bFME6tAphQ8HQsa4_YwQV42Ojfl0Oo1kZ9b5H2kO0ic' }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/' }}
        run: npm run build

      - name: Verify Supabase connectivity
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || 'https://vqeptlsfqovfyjgjjaer.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxZXB0bHNmcW92ZnlqZ2pqYWVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5NzUyMTcsImV4cCI6MjExMDU1MTIxN30.bFME6tAphQ8HQsa4_YwQV42Ojfl0Oo1kZ9b5H2kO0ic' }}
        run: |
          curl -fsS -H "apikey: $VITE_SUPABASE_ANON_KEY" "$VITE_SUPABASE_URL/auth/v1/health"
          echo ""
          curl -fsS -H "apikey: $VITE_SUPABASE_ANON_KEY" -H "Authorization: Bearer $VITE_SUPABASE_ANON_KEY" \
            "$VITE_SUPABASE_URL/rest/v1/companies?select=id&limit=1"
          echo ""

      - name: Upload dist build artifact
        uses: actions/upload-artifact@v4
        with:
          name: company-erp-dist
          path: dist
          retention-days: 7

  deploy_pages:
    name: Deploy Frontend to GitHub Pages
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production bundle for Pages
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || 'https://vqeptlsfqovfyjgjjaer.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxZXB0bHNmcW92ZnlqZ2pqYWVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5NzUyMTcsImV4cCI6MjExMDU1MTIxN30.bFME6tAphQ8HQsa4_YwQV42Ojfl0Oo1kZ9b5H2kO0ic' }}
          VITE_BASE_PATH: "${{ steps.pages.outputs.base_path }}/"
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
